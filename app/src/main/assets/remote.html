<script>
    let currentSpeed = Number(localStorage.getItem('panelSpeed') || 0);
    let speedDirection = Number(localStorage.getItem('panelSpeedDirection') || 1);
    let timerHours = Number(localStorage.getItem('timerHours') || 0);
    let isPowered = localStorage.getItem('isPowered') !== '0';
    let isSleepMode = localStorage.getItem('isSleepMode') === '1';
    let isScreenInverted = localStorage.getItem('isScreenInverted') === '1';
    const maxSpeed = 5;
    const minSpeed = 0;

    const translations = {
        pt: {
            title: 'TempSense 36 Pro - Controle',
            cooling: 'RESFRIANDO',
            off: 'DESLIGADO',
            sleep: 'MODO SONO',
            online: 'Online • IR MSB',
            syncTitle: 'Sincronizadores',
            syncInfo: 'Servem para sincronizar o estado visual da app com o estado real da torre. Nao enviam IR.',
            power: 'Power',
            night: 'Noite',
            timer: 'Timer',
            flip: 'Inverter'
        },
        en: {
            title: 'TempSense 36 Pro - Remote',
            cooling: 'COOLING',
            off: 'OFF',
            sleep: 'SLEEP MODE',
            online: 'Online • IR MSB',
            syncTitle: 'Sync controls',
            syncInfo: 'Use these to sync the app display with the real tower state. They do not send IR.',
            power: 'Power',
            night: 'Sleep',
            timer: 'Timer',
            flip: 'Flip'
        },
        es: {
            title: 'TempSense 36 Pro - Mando',
            cooling: 'ENFRIANDO',
            off: 'APAGADO',
            sleep: 'MODO NOCHE',
            online: 'Online • IR MSB',
            syncTitle: 'Sincronizadores',
            syncInfo: 'Sirven para sincronizar el estado visual de la app con el estado real de la torre. No envian IR.',
            power: 'Encendido',
            night: 'Noche',
            timer: 'Timer',
            flip: 'Invertir'
        },
        fr: {
            title: 'TempSense 36 Pro - Telecommande',
            cooling: 'REFROIDISSEMENT',
            off: 'ETEINT',
            sleep: 'MODE NUIT',
            online: 'Online • IR MSB',
            syncTitle: 'Synchroniseurs',
            syncInfo: "Ils servent a synchroniser l'etat visuel de l'app avec l'etat reel de la tour. Ils n'envoient pas d'IR.",
            power: 'Power',
            night: 'Nuit',
            timer: 'Timer',
            flip: 'Inverser'
        }
    };
    const langCode = (navigator.language || 'en').toLowerCase().split('-')[0];
    const i18n = translations[langCode] || translations.en;

    const statusLabel = document.getElementById('status-label');
    const particlesContainer = document.getElementById('wind-particles');
    const fanImg = document.getElementById('main-fan-img');
    const fanContainer = document.getElementById('fan-container');
    const sleepFlash = document.getElementById('sleep-flash');

    function applyLanguage() {
        document.documentElement.lang = langCode;
        document.title = i18n.title;
        document.getElementById('sleep-overlay-label').textContent = i18n.sleep;
        document.getElementById('online-label').textContent = i18n.online;
        document.getElementById('sync-title').textContent = i18n.syncTitle;
        document.getElementById('sync-info-text').textContent = i18n.syncInfo;
        document.getElementById('sync-power-label').textContent = i18n.power;
        document.getElementById('sync-sleep-label').textContent = i18n.night;
        document.getElementById('sync-timer-label').textContent = i18n.timer;
        document.getElementById('sync-flip-label').textContent = i18n.flip;
    }

    function sendIr(command) {
        if (window.LevoitIR && typeof window.LevoitIR.send === 'function') {
            window.LevoitIR.send(command);
        }
    }

    function saveState() {
        localStorage.setItem('panelSpeed', String(currentSpeed));
        localStorage.setItem('panelSpeedDirection', String(speedDirection));
        localStorage.setItem('timerHours', String(timerHours));
        localStorage.setItem('isPowered', isPowered ? '1' : '0');
        localStorage.setItem('isSleepMode', isSleepMode ? '1' : '0');
        localStorage.setItem('isScreenInverted', isScreenInverted ? '1' : '0');
    }

    function applyScreenInversion() {
        document.body.classList.toggle('screen-inverted', isScreenInverted);
    }

    function updateSyncButtons() {
        const active = 'text-secondary-fixed';
        const inactive = 'text-on-surface-variant/40';
        document.getElementById('sync-power-btn').className = `flex flex-col items-center ${isPowered ? active : inactive}`;
        document.getElementById('sync-sleep-btn').className = `flex flex-col items-center ${isSleepMode ? active : inactive} hover:text-primary transition-colors`;
        document.getElementById('sync-timer-btn').className = `flex flex-col items-center ${timerHours > 0 ? active : inactive} hover:text-primary transition-colors`;
        document.getElementById('sync-flip-btn').className = `flex flex-col items-center ${isScreenInverted ? active : inactive} hover:text-primary transition-colors`;
    }

    // Generate wind particles based on current intensity
    function triggerWindEffect() {
        if (!isPowered || currentSpeed === 0) return;
        
        // Number of particles depends on currentSpeed
        const count = Math.ceil(currentSpeed * 2);
        for(let i=0; i<count; i++) {
            setTimeout(createWindParticle, Math.random() * 300);
        }
    }

    function createWindParticle() {
        const particle = document.createElement('div');
        particle.className = 'wind-particle';
        
        // Random origin on the right side of the fan tower (vertical span)
        const top = 20 + Math.random() * 60; 
        particle.style.top = `${top}%`;
        particle.style.left = `50%`; // Starts near the tower center/right
        
        // Direction vectors: blow outward horizontally
        const tx = 150 + Math.random() * 250;
        const ty = (Math.random() - 0.5) * 40;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        
        // Speed scaling
        const duration = 0.4 + (Math.random() * 0.4);
        particle.style.animationDuration = `${duration}s`;
        
        particlesContainer.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove());
    }

    function updateUI() {
        saveState();
        if (!isPowered) {
            statusLabel.textContent = i18n.off;
            statusLabel.classList.replace('text-secondary-fixed', 'text-on-surface-variant');
            document.getElementById('conn-dot').classList.replace('bg-blue-300', 'bg-red-500');
            fanImg.style.filter = 'brightness(0.3) grayscale(0.8) contrast(1.1)';
            fanImg.style.transform = 'scale(1.05)';
            fanContainer.classList.remove('fan-powered-on');
        } else {
            statusLabel.textContent = isSleepMode ? i18n.sleep : i18n.cooling;
            statusLabel.classList.replace('text-on-surface-variant', 'text-secondary-fixed');
            document.getElementById('conn-dot').classList.replace('bg-red-500', 'bg-blue-300');
            
            fanImg.style.transform = 'scale(1.1)';
            fanContainer.classList.add('fan-powered-on');
            
            if(isSleepMode) {
                 fanImg.style.filter = 'brightness(0.6)';
            } else {
                 fanImg.style.filter = ''; // rely on class
            }
        }
        applyScreenInversion();
        updateSyncButtons();
    }

    function togglePower() {
        sendIr('power');
        isPowered = !isPowered;
        if (isPowered) {
            triggerWindEffect();
        }
        updateUI();
    }

    function toggleSleep() {
        if (!isPowered) return;
        sendIr('sleep');
        
        isSleepMode = !isSleepMode;
        
        // Toggle temporary visual overlay
        if (isSleepMode) {
            sleepFlash.classList.add('active');
            setTimeout(() => {
                sleepFlash.classList.remove('active');
            }, 3000);
        }
        updateUI();
    }

    // Cyclic Fan Speed Logic
    document.getElementById('btn-speed-img').addEventListener('click', () => {
        if (!isPowered) return;
        if (currentSpeed >= maxSpeed) speedDirection = -1;
        if (currentSpeed <= minSpeed) speedDirection = 1;
        if (speedDirection > 0) {
            currentSpeed = Math.min(maxSpeed, currentSpeed + 1);
            sendIr('plus');
        } else {
            currentSpeed = Math.max(minSpeed, currentSpeed - 1);
            sendIr('minus');
        }
        updateUI();
        if (currentSpeed > 0) {
            triggerWindEffect();
        }
    });

    // Bind Image Hotspots
    document.getElementById('btn-power-img').addEventListener('click', togglePower);
    document.getElementById('btn-sleep-img').addEventListener('click', toggleSleep);
    document.getElementById('btn-swing-img').addEventListener('click', () => {
        sendIr('swing');
        if (isPowered) triggerWindEffect();
    });
    document.getElementById('btn-mode-img').addEventListener('click', () => {
        sendIr('mode');
        if (isPowered) triggerWindEffect();
    });
    document.getElementById('btn-timer-img').addEventListener('click', () => {
        timerHours = (timerHours + 1) % 13;
        sendIr('timer');
        updateUI();
        if (isPowered) triggerWindEffect();
    });

    document.getElementById('sync-power-btn').addEventListener('click', () => {
        isPowered = !isPowered;
        updateUI();
    });
    document.getElementById('sync-sleep-btn').addEventListener('click', () => {
        isSleepMode = !isSleepMode;
        updateUI();
    });
    document.getElementById('sync-timer-btn').addEventListener('click', () => {
        timerHours = (timerHours + 1) % 13;
        updateUI();
    });
    document.getElementById('sync-flip-btn').addEventListener('click', () => {
        isScreenInverted = !isScreenInverted;
        updateUI();
    });
    document.getElementById('sync-info-toggle').addEventListener('click', () => {
        const text = document.getElementById('sync-info-text');
        const arrow = document.getElementById('sync-info-arrow');
        const open = text.classList.toggle('hidden') === false;
        arrow.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    // Periodic wind drift for ambient feel
    setInterval(() => {
        if(isPowered && currentSpeed > 0 && !isSleepMode) {
            createWindParticle();
        }
    }, 1200);

    // Initial state
    applyLanguage();
    updateUI();
</script>
</body></html>
